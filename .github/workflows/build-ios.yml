name: Build iOS IPA (unsigned)

# Manual trigger only: iOS builds run on macOS runners, which consume
# Actions minutes much faster than Linux runners. Run from the Actions
# tab whenever you want a fresh build.
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml pins the Dart SDK to >=2.19.0-304.0.dev <3.0.0,
          # so a modern Flutter stable (Dart 3.x) can't resolve deps.
          # 3.7.12 is the last 3.7.x release, shipping Dart 2.19.6.
          flutter-version: '3.7.12'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: DEBUG dump auto-generated Podfile
        run: |
          flutter build ios --config-only
          echo "-----PODFILE-----"
          cat ios/Podfile

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --verbose

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r spothole-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: spothole-unsigned-ipa
          path: spothole-unsigned.ipa
